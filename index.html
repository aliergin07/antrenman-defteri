<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B63">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<title>Antrenman Defteri</title>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first gym log — sticky day header, session switch, exercise cards with tap-to-tick sets, bottom tab bar + rest timer. */
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --fg:#16201F; --muted:#5A6866; --line:#D3DAD8;
  --accent:#0E6B63; --accent-soft:#D6ECE9; --on-accent:#FFFFFF;
  --warn:#9A4A10; --warn-soft:#F7E6D6; --done:#0E6B63;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18201F; --fg:#E2E9E7; --muted:#9AA9A6; --line:#2B3634;
  --accent:#3CC4B5; --accent-soft:#163A36; --on-accent:#0F1514;
  --warn:#F0A766; --warn-soft:#3A2A1C; --done:#3CC4B5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18201F; --fg:#E2E9E7; --muted:#9AA9A6; --line:#2B3634;
  --accent:#3CC4B5; --accent-soft:#163A36; --on-accent:#0F1514;
  --warn:#F0A766; --warn-soft:#3A2A1C; --done:#3CC4B5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:8px}
.nav button.arrow{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem}
.nav .day{flex:1;min-width:0;text-align:center}
.nav .day b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;letter-spacing:.01em}
.nav .day small{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.todaybtn{font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer}
.row2{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.knee{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.knee.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.daytitle{margin:16px 0 4px;font-family:var(--display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em}
.daynote{color:var(--muted);font-size:.92rem;margin:0 0 6px}
.banner{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-top:10px}
.banner b{color:var(--warn)}
.block{margin-top:18px}
.block h2{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.block h2 span{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;display:grid;gap:8px}
.ex.complete{border-color:var(--done)}
.ex.off{opacity:.6}
.exhead{display:flex;gap:10px;align-items:flex-start}
.exname{flex:1;min-width:0;font-weight:600;line-height:1.25}
.exname a{color:inherit;text-decoration:none}
.exname a::after{content:" ↗";color:var(--accent);font-weight:600;font-size:.85em}
.exname small{display:block;font-weight:400;color:var(--muted);font-size:.84rem;margin-top:2px}
.dose{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag{font-size:.72rem;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--warn-soft);color:var(--warn);margin-left:4px;vertical-align:1px}
.sets{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.set[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-accent)}
.check{height:42px;padding:0 16px;border-radius:21px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-accent)}
.w{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.w input{width:96px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 8px;font:inherit;font-variant-numeric:tabular-nums;text-align:right}
.w small{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.setcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.rep{width:44px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:center;font:inherit;font-size:.85rem;font-variant-numeric:tabular-nums;padding:0}
.hedef{color:var(--accent)!important;font-weight:700}
.replbl{font-size:.7rem;color:var(--muted)}
.alt{font-size:.88rem;color:var(--warn)}
.log{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.log h2{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.log label{font-size:.88rem;font-weight:600;display:block;margin-bottom:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{min-width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:8px;font:inherit;resize:vertical}
.saved{font-size:.78rem;color:var(--muted);text-align:right}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:640px;width:100%;display:flex;padding-inline:16px;gap:6px}
.tabbar button{flex:1;border:0;background:transparent;padding:12px 0;font-weight:600;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabbar button[aria-pressed="true"]{color:var(--accent);border-top-color:var(--accent)}
.timer{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;font-variant-numeric:tabular-nums}
.timer.run{background:var(--warn)}
.empty{color:var(--muted);padding:32px 0;text-align:center}
.week{display:grid;gap:8px;margin-top:14px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;width:100%}
.wd.today{border-color:var(--accent)}
.wd b{font-family:var(--display);font-size:1.1rem;letter-spacing:.02em}
.wd p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.hist{display:grid;gap:8px;margin-top:14px}
.hi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.hi b{font-family:var(--display);font-size:1.1rem}
.hi .meta{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.hi ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}
.rules{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.vid{font-size:.82rem;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.meta2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.totals{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar .lbl{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.bar .lbl span{color:var(--muted);font-weight:500}
.track{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.over{background:var(--warn)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:84px 1fr;gap:10px}
.meal.noimg{grid-template-columns:1fr}
.meal img{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--bg)}
.meal .info{min-width:0;display:grid;gap:4px}
.meal .info b{font-size:.95rem}
.meal .nums{font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.meal .nums strong{color:var(--fg)}
.meal .cmt{font-size:.85rem}
.meal .acts{display:flex;gap:6px;flex-wrap:wrap}
.sm{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;font-size:.8rem;font-weight:600;cursor:pointer}
.sm.danger{color:var(--warn);border-color:var(--warn)}
.form{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.form h2{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.btn{height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;padding:0 16px}
.btn.sec{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.filebtn{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:10px;border:1px dashed var(--accent);color:var(--accent);font-weight:700;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid4 label,.grid3 label{font-size:.75rem;color:var(--muted);font-weight:600}
.grid4 input,.grid3 input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 6px;font:inherit;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.est{font-size:.88rem;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.est ul{margin:4px 0 0;padding-left:18px}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl .dn{color:var(--accent);font-size:.78rem}
.rules ul{margin:6px 0 0;padding-left:18px;font-size:.9rem;display:grid;gap:4px}
.bfv{padding:10px 0;font-weight:600}.bfv .muted{font-weight:400;opacity:.6}
.pf{display:grid;gap:12px}
.pf label{display:block;font-size:.88rem;font-weight:600;margin-bottom:4px}
.pf input,.pf select{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
.pf textarea{min-height:60px}
.pf .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pf .hint{font-size:.8rem;color:var(--muted);margin-top:2px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.consent input{width:22px;height:22px;flex:0 0 auto;margin-top:2px}
.hero{background:var(--accent-soft);border-radius:12px;padding:14px;margin-top:14px}
.hero b{font-family:var(--display);font-size:1.2rem;letter-spacing:.02em}
.err{color:var(--warn);font-size:.9rem}
.pf input[type=checkbox]{width:22px;height:22px;flex:none}
.tst .fld{margin:0}.tst .fld span{display:block;font-size:.88rem;font-weight:600;margin-bottom:4px}
.tst label.fld[style]{font-weight:500}
.chipLv{display:inline-flex;gap:4px;align-items:baseline;padding:6px 10px;border-radius:999px;background:var(--accent-soft);font-size:.88rem}
.chipLv b{font-variant-numeric:tabular-nums}
.bfg{display:grid;gap:6px;margin:6px 0;font-weight:400}
.bfg-big{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:4px}
.bfg-big small{font-family:inherit;font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0}
.bfg-bar{position:relative;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin-top:6px}
.bfg-b{position:absolute;top:0;bottom:0;opacity:.35}.bfg-b.b0{background:var(--muted)}.bfg-b.b1,.bfg-b.b2{background:var(--done)}.bfg-b.b2{opacity:.22}.bfg-b.b3{background:var(--warn);opacity:.2}.bfg-b.b4{background:var(--warn);opacity:.4}
.bfg-rng{position:absolute;top:2px;bottom:2px;background:var(--accent);opacity:.75;border-radius:5px}
.bfg-mk{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--fg);border-radius:2px}
.bfg-ends,.bfg-names{position:relative;height:18px;font-size:.78rem;font-variant-numeric:tabular-nums}
.bfg-ends span{position:absolute;font-weight:700;color:var(--fg);white-space:nowrap}.bfg-ends span:first-child{transform:translateX(-100%);padding-right:4px}.bfg-ends span:last-child{padding-left:4px}
.bfg-names span{position:absolute;transform:translateX(-50%);color:var(--muted);font-size:.66rem;white-space:nowrap}
.tag.cal{display:inline-block;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.cal{display:grid;gap:8px;min-width:0}
.calbox{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:grid;gap:10px;font-size:.92rem}
.calbox small,.calres small{color:var(--muted);font-size:.82rem}
.calrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.calrow .grow{flex:1;min-width:0}
.calrow .check{height:38px}
.calin{width:54px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:0 6px;font:inherit;font-variant-numeric:tabular-nums;text-align:right}
.cal .pills button{min-width:48px;height:44px;background:var(--surface)}
.caltry{display:flex;gap:8px;justify-content:space-between;font-variant-numeric:tabular-nums}
.caltry+.caltry{border-top:1px dashed var(--line);padding-top:10px}
.caltry em{font-style:normal;font-weight:700;white-space:nowrap;color:var(--warn)}
.caltry em.ok{color:var(--done)}
.calres{border:2px solid var(--done);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.calres b{font-family:var(--display);font-size:2rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.callbl{font-size:.88rem;color:var(--muted)}
.cal .sm{min-height:36px;justify-self:start}
.last{display:grid;gap:6px}
.last .pills{align-items:center}
.formb{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
.pills .formb[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.sug{font-size:.85rem;font-weight:600;color:var(--warn)}
.sug.more{color:var(--accent)}
.hz{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.hz h2{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;margin:0}
.hz label{font-size:.88rem;font-weight:600;display:block;margin-bottom:4px}
.hz label span{font-weight:400;color:var(--muted)}
.hz .sm{min-height:36px;justify-self:start}
.hzrow{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;font-size:.92rem}
.hzrow b{display:inline-flex;align-items:center;gap:6px}
.hzrow .sm{margin-left:auto;min-height:36px}
.hzdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--done);background:var(--done);flex:0 0 auto}
.hzdot.sari{border-color:var(--warn);background:transparent}
.hzdot.kirmizi{border-color:var(--warn);background:var(--warn)}
.gains{display:grid}
.gain{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;font-size:.92rem;font-variant-numeric:tabular-nums}
.gain+.gain{border-top:1px dashed var(--line)}
.gain span span{color:var(--muted)}
.gain b{color:var(--accent);white-space:nowrap}
</style>

<div class="wrap">
  <header class="top">
    <div class="nav">
      <button class="arrow" id="prev" aria-label="Önceki gün">‹</button>
      <div class="day"><b id="dayName">Bugün</b><small id="dayMeta">Faz 1</small></div>
      <button class="arrow" id="next" aria-label="Sonraki gün">›</button>
    </div>
    <div class="row2">
      <button class="todaybtn" id="today" hidden>Bugüne dön</button>
      <button class="knee" id="knee" aria-pressed="false">Diz: normal</button>
      <div class="seg" id="seg" role="group" aria-label="Seans">
        <button data-s="antrenman" aria-pressed="false" hidden>Antrenman</button>
        <button data-s="sabah" aria-pressed="true">Sabah</button>
        <button data-s="aksam" aria-pressed="false">Akşam</button>
        <button data-s="yemek" aria-pressed="false">Yemek</button>
      </div>
    </div>
  </header>
  <main id="view"><p class="empty">Yükleniyor…</p></main>
</div>
<button class="timer" id="timer" aria-label="Dinlenme sayacı">Dinlen 90 sn</button>
<nav class="tabbar"><div class="in">
  <button data-t="gun" aria-pressed="true">Antrenman</button>
  <button data-t="hafta" aria-pressed="false">Hafta</button>
  <button data-t="olcum" aria-pressed="false">Ölçüm</button>
  <button data-t="gecmis" aria-pressed="false">Geçmiş</button>
  <button data-t="profil" aria-pressed="false">Profil</button>
</div></nav>

<script>
(function(){
const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S={profil:null,profilLoaded:false,targets:{},program:null,settings:{knee:'normal'},logs:{},cur:new Date(),tab:'gun',sess:(new Date().getHours()<14?'sabah':'aksam'),db:null,readonly:false,loaded:false,noDb:false,sample:null,assets:null,draft:{t:(h=>h<10?'sabah':h<14?'ogle':h<18?'ara':h<22?'aksam':'gece')(new Date().getHours()),blob:null,url:null,desc:'',est:null,busy:false,err:''},confirmDel:null};

const view=document.getElementById('view');

function weekOf(d){
  if(!S.program)return 1;
  const st=parseKey(S.program.start||'2026-10-05');
  const w=Math.floor((d-st)/(7*864e5))+1;
  return Math.max(1,w);
}
function pick(v,wk){if(!Array.isArray(v))return v;let out=v[0][1];for(const [f,val] of v){if(wk>=f)out=val;}return out;}
function setsFor(ex,wk){let s=pick(ex.s==null?0:ex.s,wk);if(s&&S.program&&wk===S.program.deload)s=Math.max(1,Math.ceil(s/2));return s||0;}

function hzRenk(v){

  if(v.uyku<=2||v.enerji<=2||v.agri>=4)return 'sari';

}
const hzHafif=L=>!!(L&&L.hazir&&(L.hazir.renk==='sari'||L.hazir.renk==='kirmizi'));
// Sarı/kırmızı günde setler %30 azalır, en az 1 set kalır (deload yarılamasından sonra uygulanır).
function hzSets(s,L){return s&&hzHafif(L)?Math.max(1,Math.round(s*0.7)):s;}

  }
  if(hzHafif(L))h+=`<div class="banner" id="hzBanner"><b>Bugün hafif gün:</b> setler azaltıldı, ana harekette 3–4 tekrar fazla bırak. Ağırlık artırma.${H.renk==='kirmizi'?' Ağırlıkları %10 azaltabilirsin. Kendini iyi hissetmiyorsan bugünü atlayabilirsin.':''}</div>`;

function hzPick(f,v){
  const dk=keyOf(S.cur);if(hz.day!==dk){hz.day=dk;hz.d={};hz.edit=false;}
  hz.d[f]=v;const x=Object.assign({},curLog().hazir,hz.d);
  if(x.uyku==null||x.enerji==null||x.agri==null)return;
  mutate(L=>{L.hazir={uyku:x.uyku,enerji:x.enerji,agri:x.agri,renk:hzRenk(x),t:new Date().toISOString()};});hz.d={};
}

// Çift ilerleme önerisi. Döner: {t:'up',kg} (ağırlık artır) | {t:'reps',n} (önce tekrarı artır) | {t:'hold',why} (güvenlik kapısı kapalı) | null.
function autoSug(lw,r,sets){
  if(!lw||!lw.w)return null;const w=num(lw.w);if(!(w>0))return null;
  const head=String(r||'').split('·')[0].split('/')[0];const ns=(head.match(/\d+/g)||[]).map(Number);if(!ns.length)return null;
  const top=Math.max(...ns);const reps=(lw.reps||[]).filter(Boolean).map(Number);
  if(reps.length<Math.max(1,Math.min(sets||1,2)))return null;
  if(!reps.every(x=>x>=top))return null;
  // Güvenlik kapısı: girilmemiş alan (eski kayıt) engel sayılmaz.
  const why=lw.pain>=4?'ağrı vardı':lw.hazir&&lw.hazir.renk==='kirmizi'?'kendini iyi hissetmiyordun':lw.rir===0?'son sette hiç tekrar kalmamıştı':lw.form==='bozuk'?'form bozulmuştu':'';
  if(why)return {t:'hold',why};
  // Küçük adım: artış ağırlığın %10'undan büyükse önce tekrar (üst sınır + 3).
  const inc=w<20?2:2.5;
  if(inc>w*0.1+1e-9&&!reps.every(x=>x>=top+3))return {t:'reps',n:top+3};
  return {t:'up',kg:(Math.round((w+inc)*10)/10).toString().replace('.',',')+' kg'};
}
function curLog(){return S.logs[keyOf(S.cur)]||{date:keyOf(S.cur),items:{}};}
function lastWeight(exid,beforeKey){
  const keys=Object.keys(S.logs).filter(k=>k<beforeKey).sort().reverse();
  for(const k of keys){const it=S.logs[k].items||{};for(const ik in it){if(ik.split('.').pop()===exid&&it[ik].w)return {w:it[ik].w,reps:it[ik].reps||[],k,rir:it[ik].rir,form:it[ik].form,pain:S.logs[k].pain,hazir:S.logs[k].hazir};}}
  return null;
}

// ---------- ağırlık bulma haftası (program.kalibrasyon)
const fmtKg=n=>(Math.round(n*10)/10).toString().replace('.',',');
const calDraft={};
function calOn(wk){const k=S.program&&S.program.kalibrasyon;return !!(k&&Array.isArray(k.hafta)&&k.hafta.includes(wk));}
function calT(r){const head=String(r||'').split('·')[0].split('/')[0];const ns=(head.match(/\d+/g)||[]).map(Number);if(!ns.length)return 0;return ns.length>1?Math.round((ns[0]+ns[1])/2):ns[0];}
function calInc(ex){const i=num(ex.inc);return i>0?i:2;}
function findEx(id){const i=id.lastIndexOf('.');const B=((S.program||{}).blocks||{})[id.slice(0,i)];return B&&(B.items||[]).find(x=>x.id===id.slice(i+1));}
// Bu hareketin en son tamamlanmış ağırlık bulma sonucu (selfId: o günkü kendi kaydı hariç).
function calPrev(exid,dk,selfId){
  const keys=Object.keys(S.logs).filter(k=>k<=dk).sort().reverse();
  for(const k of keys){const it=S.logs[k].items||{};for(const ik in it){if(k===dk&&ik===selfId)continue;const c=it[ik]&&it[ik].cal;if(c&&c.done&&c.w&&ik.split('.').pop()===exid)return c;}}
  return null;
}
// t={w,reps,rir}; rir 4 = "4+" (hesapta 5). Epley e1RM, hedef: T tekrar + 2 tekrar pay.
function calEval(t,T,inc,last){
  const rn=t.rir>=4?5:t.rir;const e1=t.w*(1+(t.reps+rn)/30);const wT=e1/(1+(T+2)/30);
  const lim=x=>Math.max(inc,t.rir>=4?Math.max(x,t.w+inc):t.rir<=1?Math.min(x,t.w-inc):x);
  const r2=x=>Math.round(x*100)/100;
  if(t.rir===2||t.rir===3||last)return {done:true,w:r2(lim(Math.floor(wT/inc+1e-6)*inc)),e1rm:r2(e1)};
  return {done:false,w:r2(lim(Math.round(wT/inc)*inc))};
}
function calTry(id,w,reps,rir){
  const ex=findEx(id);if(!ex)return;const T=calT(pick(ex.r||'',weekOf(S.cur))),inc=calInc(ex);
  mutate(L=>{const it=L.items[id]||(L.items[id]={});const c=it.cal=Object.assign({},it.cal);if(c.done)return;
    c.tries=(c.tries||[]).concat([{w,reps,rir}]);const ev=calEval({w,reps,rir},T,inc,c.tries.length>=3);
    if(ev.done){c.done=true;c.w=ev.w;c.e1rm=ev.e1rm;c.T=T;it.w=fmtKg(ev.w);
      const d0=(it.d||[]).slice();d0[0]=true;it.d=d0;const rr=(it.reps||[]).slice();rr[0]=w===ev.w?String(reps):'';it.reps=rr;}});
  delete calDraft[id];
}
function calUndo(id){
  mutate(L=>{const it=L.items[id];const c=it&&it.cal;if(!c||!(c.tries||[]).length)return;c.tries=c.tries.slice(0,-1);
    if(c.done){delete c.done;delete c.w;delete c.e1rm;delete c.T;it.w='';const d0=(it.d||[]).slice();d0[0]=false;it.d=d0;const rr=(it.reps||[]).slice();rr[0]='';it.reps=rr;}});
  delete calDraft[id];
}
function calCtl(ex,id,st,s,T){
  const c=st.cal||{},tries=c.tries||[],inc=calInc(ex),w0=num(ex.w0);
  const rows=tries.map((t,i)=>{const v=c.done&&i===tries.length-1?'<em class="ok">✓</em>':t.rir>=4?'<em>hafif ↑</em>':t.rir<=1?'<em>ağır ↓</em>':'<em class="ok">✓</em>';
    return `<div class="caltry"><span>Deneme ${i+1} &nbsp;<b>${fmtKg(t.w)} kg</b> × ${t.reps} · ${t.rir>=4?'4+':t.rir} daha</span>${v}</div>`;}).join('');
  const undo=tries.length?`<button class="sm" data-calundo="${esc(id)}">Son denemeyi geri al</button>`:'';
  let h=`<div class="cal" data-cal="${esc(id)}">`;
  if(c.done){
    h+=`<div class="calbox">${rows}</div><div class="calres"><small>Çalışma ağırlığın</small><b>${fmtKg(c.w)} kg × ${c.T||T}</b><small>Tahmini maksimal (1 tekrar): ~${Math.round(c.e1rm)} kg · bu bilgi gelişimini takip etmek için</small></div>`;
    if(s>1){const d0=st.d||[],rr=st.reps||[];let b='';
      for(let i=1;i<s;i++)b+=`<div class="setcol"><button class="set" data-id="${esc(id)}" data-i="${i}" aria-pressed="${!!d0[i]}" aria-label="Kalan set ${i}">${i}</button><input class="rep" inputmode="numeric" data-rid="${esc(id)}" data-ri="${i}" value="${esc(rr[i]||'')}" placeholder="${c.T||T}" aria-label="Kalan set ${i} tekrar"></div>`;
      h+=`<div class="sets"><span class="callbl">Kalan setleri ${fmtKg(c.w)} kg ile yap:</span>${b}</div>`;}
    return h+undo+'</div>';
  }
  const last=tries[tries.length-1];const sug=last?calEval(last,T,inc,false).w:w0;const dr=calDraft[id]||{};
  const wv=dr.w!=null?dr.w:(sug>0?fmtKg(sug):''),rv=dr.reps!=null?dr.reps:T;
  let pills='';for(let i=0;i<=4;i++)pills+=`<button data-rir="${i}" aria-label="${i===4?'4 veya daha fazla':i} tekrar daha">${i===4?'4+':i}</button>`;
  const hint=last?`Önerilen: ${fmtKg(sug)} kg (${last.rir>=4?'hafif geldi, artırdık':'ağır geldi, azalttık'})`:(w0>0?`Önerilen başlangıç: ${fmtKg(w0)} kg`:'Rahatça yapabileceğin bir ağırlıkla başla.');
  h+=`<div class="calbox">${rows}
    <div class="calrow"><span class="grow"><b>Isınma:</b> çok hafif${w0>0?' ('+fmtKg(w0/2)+' kg)':''} × 10 tekrar</span><button class="check" data-calwarm="${esc(id)}" aria-pressed="${!!c.warm}" aria-label="Isınma yapıldı">✓</button></div>
    <div class="calrow"><b>Deneme ${tries.length+1}:</b><input class="calin" inputmode="decimal" data-calw value="${esc(wv)}" aria-label="Deneme ağırlığı (kg)"><span>kg ×</span><input class="calin" inputmode="numeric" data-calr value="${esc(rv)}" aria-label="Deneme tekrarı"><span>tekrar</span></div>
    <div>Kaç tekrar daha yapabilirdin?</div>
    <div class="pills" role="group">${pills}</div>
    <small>${hint}</small><div class="err" data-calerr></div></div>`;
  return h+undo+'</div>';
}
// Profil: ilk tahmini maksimal → son 14 günün en iyisi. En az 1 hafta veri yoksa boş döner.
function gucGelisim(){
  const names={};for(const bk in ((S.program||{}).blocks||{}))for(const ex of S.program.blocks[bk].items||[])names[ex.id]=ex.n;
  const first={};
  for(const k of Object.keys(S.logs).sort()){const it=S.logs[k].items||{};for(const ik in it){const c=it[ik]&&it[ik].cal,x=ik.split('.').pop();if(c&&c.done&&c.e1rm>0&&!first[x])first[x]={k,e:c.e1rm};}}
  const lim=new Date();lim.setHours(0,0,0,0);lim.setDate(lim.getDate()-14);const from=keyOf(lim);let rows='';
  for(const x in first){const f=first[x];let best=0,lastK='';
    for(const k in S.logs){if(k<from||k<=f.k)continue;const it=S.logs[k].items||{};
      for(const ik in it){if(ik.split('.').pop()!==x)continue;const w=num(it[ik].w);if(!(w>0))continue;
        for(const r of it[ik].reps||[]){const n=num(r);if(n>0){best=Math.max(best,w*(1+n/30));if(k>lastK)lastK=k;}}}}
    if(!best||parseKey(lastK)-parseKey(f.k)<6.5*864e5)continue;
    const pct=Math.round((best-f.e)/f.e*100);
    rows+=`<div class="gain"><span>${esc(names[x]||x)} <span>tahmini maks ${Math.round(f.e)} → ${Math.round(best)} kg</span></span><b>${pct<0?'−':'+'}%${Math.abs(pct)}</b></div>`;}
  return rows?`<section class="form" id="gucGelisim"><h2>Güç gelişimin</h2><div class="gains">${rows}</div></section>`:'';
}

// ---------- saving (one write at a time, debounced)
const dirty=new Set();let pending=null,timerSave=null,chain=Promise.resolve();
function flushSave(){const keys=[...dirty];dirty.clear();pending=null;
  for(const k of keys){const body=JSON.parse(JSON.stringify(S.logs[k]));body.updated=new Date().toISOString();
    chain=chain.then(()=>S.db.doc('logs/'+k).set(body)).then(()=>flash('Kaydedildi')).catch(e=>{if(e&&e.code==='invalid_argument'){S.readonly=true;flash('Kaydedilemedi: link geçersiz olabilir');}else{dirty.add(k);flash('Kaydedilemedi, birazdan tekrar denenecek');setTimeout(flushSave,4000);}});}}
function queueSave(key){dirty.add(key);pending=key;clearTimeout(timerSave);timerSave=setTimeout(flushSave,600);}
function mutate(fn){
  if(!S.db||S.readonly)return;
  const k=keyOf(S.cur);const L=JSON.parse(JSON.stringify(curLog()));L.date=k;L.items=L.items||{};fn(L);S.logs[k]=L;queueSave(k);
}
let flashT=null;function flash(t){const el=document.getElementById('savedMsg');if(el){el.textContent=t;clearTimeout(flashT);flashT=setTimeout(()=>{el.textContent='';},2500);}}

// ---------- seanslar
// Anahtarlar: sabah, aksam, antrenman (ya da başka bir ad). Programın hiçbir gününde birden fazla dolu seans yoksa tek "Antrenman" sekmesi gösterilir.
function dayOf(d){const P=S.program||{};return (P.dates||{})[keyOf(d)]||(P.days||{})[String(d.getDay())];}
function sessKeys(day){const ss=(day&&day.sessions)||{};return Object.keys(ss).filter(k=>Array.isArray(ss[k])&&ss[k].length);}
function singleSess(){const P=S.program||{};return ![...Object.values(P.days||{}),...Object.values(P.dates||{})].some(day=>sessKeys(day).length>1);}
// Seçili sekmenin blokları. Tek seanslıda günün seansı (anahtar adı ne olursa olsun); iki seanslıda akşam dışındaki her şey Sabah'ta.
function blocksFor(day,sess){const ss=(day&&day.sessions)||{};return sessKeys(day).filter(k=>singleSess()||(sess==='aksam')===(k==='aksam')).reduce((a,k)=>a.concat(ss[k]),[]);}
// Varsayılan seans: gün değişince yeniden seçilir; kullanıcının o gün için seçimi korunur.
function syncSess(){
  if(!S.program||S.sess==='yemek')return;
  const dk=keyOf(S.cur);
  if(singleSess()){S.sess='antrenman';S.sessDay=dk;return;}
  if(S.sessDay===dk&&S.sess!=='antrenman')return;
  const day=dayOf(S.cur),sb=blocksFor(day,'sabah').length,ak=blocksFor(day,'aksam').length;
  S.sess=sb&&!ak?'sabah':ak&&!sb?'aksam':(new Date().getHours()<14?'sabah':'aksam');S.sessDay=dk;
}

// ---------- render
function render(){
  hdr(true);syncSess();
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===S.tab)));
  const d=S.cur,todayKey=keyOf(new Date());
  document.getElementById('dayName').textContent=(keyOf(d)===todayKey?'Bugün · ':'')+DAYS[d.getDay()];
  const wk=weekOf(d);
  document.getElementById('dayMeta').textContent=d.getDate()+' '+MONTHS[d.getMonth()]+(S.program?' · Hafta '+wk+'/'+(S.program.weeks||9)+(S.program.deload===wk?' · deload':''):'');
  document.getElementById('today').hidden=keyOf(d)===todayKey;
  const kb=document.getElementById('knee');const kOn=S.settings.knee==='sivi'&&!!(S.program&&S.program.kneeMode);kb.classList.toggle('on',kOn);kb.textContent=kOn?'Diz: sıvı var':'Diz: normal';kb.setAttribute('aria-pressed',String(kOn));kb.hidden=!(S.program&&S.program.kneeMode);
  const one=!!S.program&&singleSess();
  document.querySelectorAll('#seg button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.s===S.sess));if(b.dataset.s!=='yemek')b.hidden=(b.dataset.s==='antrenman')!==one;});
  document.getElementById('seg').style.visibility=S.tab==='gun'&&S.program?'visible':'hidden';
  document.getElementById('timer').hidden=!(S.tab==='gun'&&S.sess!=='yemek'&&S.program);
  if(S.noDb){hdr(false);view.innerHTML='<div class="hero"><b>Bu link geçersiz</b><p class="daynote" style="margin:6px 0 0">Sana gönderilen kişisel linki eksiksiz açtığından emin ol. Sorun devam ederse programını hazırlayan kişiye yaz.</p></div>';return;}
  if(!S.loaded||!S.profilLoaded){view.innerHTML='<p class="empty">Yükleniyor…</p>';return;}
  if(S.tab==='profil')return renderProfil();
  if(S.profilLoaded&&!S.profil)return renderProfil();
  if(S.tab==='test'||(!S.program&&!(S.profil.test&&S.profil.test.done)))return renderTest();
  if(S.tab==='olcum')return renderOlcum();
  if(!S.program)return renderBekle();
  if(S.tab==='hafta')return renderWeek();
  if(S.tab==='gecmis')return renderHist();
  if(S.sess==='yemek')return renderMeals();
  renderDay();
}
function rehberLink(ex){const base=S.program.rehber;return base?base+'#'+(ex.g||ex.id):null;}
function renderDay(){
  const P=S.program,d=S.cur,wk=weekOf(d);
  const day=dayOf(d);const L=curLog();const kOn=S.settings.knee==='sivi'&&!!P.kneeMode;const dk=keyOf(d);
  let h='';
  if(!day){view.innerHTML='<p class="empty">Bu gün için program yok.</p>';return;}
  h+=`<h1 class="daytitle">${esc(day.title||'')}</h1>`;
  if(day.note)h+=`<p class="daynote">${esc(day.note)}</p>`;
  if(kOn)h+=`<div class="banner"><b>Diz modu açık:</b> dizde sıvı varken bacağa yük bindiren hareketler kapalı, yerine diz dostu hareketler geldi. Sıvı geçince "Diz" düğmesine dokunup normale dön.</div>`;
  if(kOn&&day.kneeNote)h+=`<div class="banner">${esc(day.kneeNote)}</div>`;
  const keys=blocksFor(day,S.sess);
  if(keys.length)h+=hzCard(L,dk);
  if(keys.length&&calOn(wk))h+=`<div class="hero" id="calInfo"><b>${wk}. hafta: ağırlık bulma haftası</b><p class="daynote" style="margin:6px 0 0">Bu hafta her harekette sana uygun ağırlığı buluyoruz. Isınma setinden sonra önerilen ağırlıkla hedef tekrarı yap, sonra "kaç tekrar daha yapabilirdin?" sorusunu cevapla. Uygulama ağırlığı ayarlayacak.</p></div>`;
  if(!keys.length)h+=`<p class="empty">${S.sess==='sabah'?'Bu sabah antrenman yok.':S.sess==='aksam'?'Bu akşam antrenman yok.':'Bugün antrenman yok.'}</p>`;
  for(const bk of keys){
    const B=(P.blocks||{})[bk];if(!B)continue;
    const items=(B.items||[]).filter(ex=>{
      if(ex.knee==='only'&&!kOn)return false;
      if(ex.fw&&wk<ex.fw)return false;
      if(ex.dow&&!ex.dow.includes(d.getDay()))return false;
      return true;});
    if(kOn)items.sort((a,b)=>(a.leg?1:0)-(b.leg?1:0));
    if(!items.length)continue;
    let doneN=0,totN=0;
    let cards='';
    for(const ex of items){

  view.innerHTML=`<div class="hero"><b>Teşekkürler${p.ad?', '+esc(p.ad):''}! ✓</b><p class="daynote" style="margin:6px 0 0">Bilgilerin alındı. Programın hazırlanıyor, hazır olunca burada otomatik görünecek.</p></div>${testSummary()}${p.test&&p.test.skip?'<section class="form"><h2>Not</h2><p class="daynote" style="margin:0">Testi şimdilik atladın. Programın hafif başlangıçla hazırlanacak; doktorun onay verince testi Profil sekmesinden yapabilirsin.</p></section>':''}
  <section class="form"><h2>Bu arada</h2><ul style="margin:0;padding-left:18px;display:grid;gap:6px"><li>İlk ölçümlerin kaydedildi. Her Pazar sabahı <b>Ölçüm</b> sekmesinden güncelle.</li><li>Bilgilerini değiştirmek istersen <b>Profil</b> sekmesine git.</li><li>Telefonunda tarayıcı menüsünden <b>Ana ekrana ekle</b> dersen uygulama gibi açılır.</li></ul></section>`;}
function renderWeek(){
  const P=S.program,base=new Date(S.cur);const dow=(base.getDay()+6)%7;base.setDate(base.getDate()-dow);
  const wk=weekOf(base);let h=`<h1 class="daytitle">Hafta ${wk}${P.deload===wk?' · deload':''}</h1><div class="week">`;
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);const day=(P.dates||{})[keyOf(d)]||(P.days||{})[String(d.getDay())]||{};
    const blk=k=>((P.blocks||{})[k]||{}).t||k;const one=singleSess(),sb=blocksFor(day,'sabah').map(blk).join(', '),ak=blocksFor(day,'aksam').map(blk).join(', ');
    const L=S.logs[keyOf(d)];const n=L?Object.values(L.items||{}).reduce((a,x)=>a+(x.d||[]).filter(Boolean).length,0):0;
    h+=`<button class="wd${keyOf(d)===keyOf(new Date())?' today':''}" data-go="${keyOf(d)}"><b>${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</b> · ${esc(day.title||'')}${n?` · ✓ ${n} set`:''}${one?`<p>Antrenman: ${esc(sb||'—')}</p>`:`<p>Sabah: ${esc(sb||'—')}</p><p>Akşam: ${esc(ak||'—')}</p>`}</button>`;}
  view.innerHTML=h+'</div>';
}
function renderHist(){
  const keys=Object.keys(S.logs).sort().reverse();
  if(!keys.length){view.innerHTML='<p class="empty">Henüz kayıt yok. Antrenmanda setleri işaretledikçe burada görünecek.</p>';return;}
  const names={};for(const bk in ((S.program||{}).blocks||{}))for(const ex of S.program.blocks[bk].items||[])names[ex.id]=ex.n;
  let h='<div class="hist">';
  for(const k of keys){const L=S.logs[k];const d=parseKey(k);let sets=0;const ws=[];
    for(const ik in (L.items||{})){const it=L.items[ik];sets+=(it.d||[]).filter(Boolean).length;if(it.w)ws.push(`${names[ik.split('.').pop()]||ik}: ${it.w}${it.reps&&it.reps.some(Boolean)?' × '+it.reps.filter(Boolean).join('/'):''}`);}
    h+=`<article class="hi"><b>${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</b><div class="meta">${sets} set${L.knee!=null?' · diz '+L.knee+'/3':''}${L.pain!=null?' · ağrı '+L.pain+'/10':''}${L.hazir&&HZ_AD[L.hazir.renk]?' · hazırlık: '+HZ_AD[L.hazir.renk].toLocaleLowerCase('tr'):''}</div>${ws.length?`<ul>${ws.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}${L.saglik&&L.saglik.ozet?`<p class="meta">⌚ ${esc(L.saglik.ozet)}</p>`:''}${L.note?`<p class="meta">${esc(L.note)}</p>`:''}</article>`;}
  view.innerHTML=h+'</div>';
}

// ---------- events
view.addEventListener('click',e=>{
  const tm=e.target.closest('[data-tmode]');if(tm){TT.mode[tm.dataset.tmode]=tm.dataset.m;tm.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===tm)));return;}
  const tc=e.target.closest('[data-tch]');if(tc){const k=tc.dataset.tch;TT.draft[k]=TT.draft[k]||{};TT.draft[k].ch=tc.dataset.v;tc.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===tc)));return;}
  const tt=e.target.closest('[data-ttm]');if(tt){tTimer(tt);return;}
  if(e.target.id==='saveTest'){saveTest(false);return;}
  if(e.target.id==='skipTest'){saveTest(true);return;}
  if(e.target.id==='redoTest'){S.tab='test';render();window.scrollTo(0,0);return;}
  const go=e.target.closest('[data-go]');if(go){S.cur=parseKey(go.dataset.go);S.tab='gun';render();window.scrollTo(0,0);return;}
  const hp=e.target.closest('[data-hz]');if(hp){hzPick(hp.dataset.hz,+hp.dataset.v);render();return;}
  if(e.target.closest('[data-hzedit]')){hz.day=keyOf(S.cur);hz.d={};hz.edit=true;render();return;}
  if(e.target.closest('[data-hzok]')){hz.edit=false;hz.d={};render();return;}
  const cw=e.target.closest('[data-calwarm]');if(cw){const id=cw.dataset.calwarm;mutate(L=>{const it=L.items[id]||(L.items[id]={});it.cal=Object.assign({},it.cal,{warm:!(it.cal&&it.cal.warm)});});render();return;}
  const cu=e.target.closest('[data-calundo]');if(cu){calUndo(cu.dataset.calundo);render();return;}
  const cr=e.target.closest('[data-rir]');if(cr){const box=cr.closest('[data-cal]'),id=box.dataset.cal;const w=num(box.querySelector('[data-calw]').value),reps=Math.round(num(box.querySelector('[data-calr]').value));
    if(!(w>0&&reps>0)){box.querySelector('[data-calerr]').textContent='Önce kullandığın ağırlığı (kg) ve yaptığın tekrarı yaz.';return;}
    calTry(id,w,reps,+cr.dataset.rir);startTimer();render();return;}
  const lr=e.target.closest('[data-lr]');if(lr){const id=lr.dataset.lr,v=+lr.dataset.v;mutate(L=>{const it=L.items[id]||(L.items[id]={});if(it.rir===v)delete it.rir;else it.rir=v;});render();return;}
  const fb=e.target.closest('[data-form]');if(fb){const id=fb.dataset.form;mutate(L=>{const it=L.items[id]||(L.items[id]={});if(it.form==='bozuk')delete it.form;else it.form='bozuk';});render();return;}
  const b=e.target.closest('button[data-id]');
  if(b){const id=b.dataset.id,i=+b.dataset.i;mutate(L=>{const it=L.items[id]||(L.items[id]={});const d0=(it.d||[]).slice();d0[i]=!d0[i];it.d=d0;});
    if(b.classList.contains('set')&&curLog().items[b.dataset.id].d[i])startTimer();render();return;}
  const mt=e.target.closest('[data-mt]');if(mt){S.draft.desc=(document.getElementById('mealDesc')||{}).value||S.draft.desc;S.draft.t=mt.dataset.mt;render();return;}
  if(e.target.id==='estBtn'){estimate();return;}
  if(e.target.id==='saveMeal'){saveMeal();return;}
  const del=e.target.closest('[data-del]');if(del){const id=del.dataset.del;if(S.confirmDel!==id){S.confirmDel=id;render();return;}
    const m=(curLog().meals||[]).find(x=>x.id===id);mutate(L=>{L.meals=(L.meals||[]).filter(x=>x.id!==id);});S.confirmDel=null;render();
    if(m&&m.img&&S.assets)S.assets.delete(m.img).catch(()=>{});return;}
  const k=e.target.closest('[data-knee]');if(k){const v=+k.dataset.knee;mutate(L=>{L.knee=L.knee===v?null:v;});render();return;}
  const hb=e.target.closest('[data-h]');if(hb){const f=hb.dataset.h,v=+hb.dataset.v;mutate(L=>{L.haftalik=Object.assign({},L.haftalik||{});L.haftalik[f]=L.haftalik[f]===v?null:v;});render();return;}
  if(e.target.id==='saveProf'){saveProfil();return;}
  const p=e.target.closest('[data-pain]');if(p){const v=+p.dataset.pain;mutate(L=>{L.pain=L.pain===v?null:v;});render();return;}
});
view.addEventListener('input',e=>{

});
document.getElementById('prev').onclick=()=>{S.cur.setDate(S.cur.getDate()-(S.tab==='hafta'?7:1));S.cur=new Date(S.cur);render();};

// ---------- rest timer
let tEnd=0,tInt=null;const tb=document.getElementById('timer');
function startTimer(sec){sec=sec||90;tEnd=Date.now()+sec*1000;tb.classList.add('run');clearInterval(tInt);tick();tInt=setInterval(tick,250);}
function stopTimer(){clearInterval(tInt);tb.classList.remove('run');tb.textContent='Dinlen 90 sn';}
function tick(){const left=Math.ceil((tEnd-Date.now())/1000);if(left<=0){stopTimer();tb.textContent='Hazır! Sonraki set';try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}setTimeout(()=>{if(!tb.classList.contains('run'))tb.textContent='Dinlen 90 sn';},4000);return;}
  tb.textContent='Dinlen '+Math.floor(left/60)+':'+pad(left%60)+' · durdur';}
tb.onclick=()=>{if(tb.classList.contains('run'))stopTimer();else startTimer(90);};

async function okOrThrow(p){const ok=await p;if(ok!==true)throw {code:'invalid_argument'};return ok;}
S.db={doc:(path)=>({set:(body)=>{
  if(path.startsWith('logs/'))return okOrThrow(rpc('pt_save_log',{p_token:TOKEN,p_day:path.slice(5),p_data:body}));
  if(path==='app/profil')return okOrThrow(rpc('pt_save_profil',{p_token:TOKEN,p_profil:body}));
  if(path==='app/settings')return okOrThrow(rpc('pt_save_settings',{p_token:TOKEN,p_settings:body}));
  return Promise.reject({code:'invalid_argument'});}})};
async function load(){
  if(!/^[0-9a-f-]{36}$/i.test(TOKEN)){S.noDb=true;render();return;}
  let d;try{d=await rpc('pt_get',{p_token:TOKEN});}catch(e){if(!S.loaded){view.innerHTML='<p class="empty">Bağlantı kurulamadı. İnternetini kontrol edip sayfayı yenile.</p>';}return;}
  if(!d){S.noDb=true;render();return;}
  S.profil=d.profil||null;S.profilLoaded=true;S.program=d.program||null;
  const t=d.targets||{};S.targets=t.items||{};
  S.settings=Object.assign({knee:'normal'},d.settings||{});
  const next=d.logs||{};for(const k of dirty)if(S.logs[k])next[k]=S.logs[k];if(pending&&S.logs[pending])next[pending]=S.logs[pending];
  S.logs=next;S.loaded=true;
  const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))return;
  render();}
load();
