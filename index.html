<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B63">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Antrenman Defteri</title>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first gym log — sticky day header, session switch, exercise cards with tap-to-tick sets, bottom tab bar + rest timer. */
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --fg:#16201F; --muted:#5A6866; --line:#D3DAD8;
  --accent:#0E6B63; --accent-soft:#D6ECE9; --on-accent:#FFFFFF;
  --warn:#9A4A10; --warn-soft:#F7E6D6; --done:#0E6B63;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18201F; --fg:#E2E9E7; --muted:#9AA9A6; --line:#2B3634;
  --accent:#3CC4B5; --accent-soft:#163A36; --on-accent:#0F1514;
  --warn:#F0A766; --warn-soft:#3A2A1C; --done:#3CC4B5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18201F; --fg:#E2E9E7; --muted:#9AA9A6; --line:#2B3634;
  --accent:#3CC4B5; --accent-soft:#163A36; --on-accent:#0F1514;
  --warn:#F0A766; --warn-soft:#3A2A1C; --done:#3CC4B5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:8px}
.nav button.arrow{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem}
.nav .day{flex:1;min-width:0;text-align:center}
.nav .day b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;letter-spacing:.01em}
.nav .day small{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.todaybtn{font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer}
.row2{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.knee{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.knee.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.daytitle{margin:16px 0 4px;font-family:var(--display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em}
.daynote{color:var(--muted);font-size:.92rem;margin:0 0 6px}
.banner{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-top:10px}
.banner b{color:var(--warn)}
.block{margin-top:18px}
.block h2{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.block h2 span{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;display:grid;gap:8px}
.ex.complete{border-color:var(--done)}
.ex.off{opacity:.6}
.exhead{display:flex;gap:10px;align-items:flex-start}
.exname{flex:1;min-width:0;font-weight:600;line-height:1.25}
.exname a{color:inherit;text-decoration:none}
.exname a::after{content:" ↗";color:var(--accent);font-weight:600;font-size:.85em}
.exname small{display:block;font-weight:400;color:var(--muted);font-size:.84rem;margin-top:2px}
.dose{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag{font-size:.72rem;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--warn-soft);color:var(--warn);margin-left:4px;vertical-align:1px}
.sets{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.set[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-accent)}
.check{height:42px;padding:0 16px;border-radius:21px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-accent)}
.w{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.w input{width:96px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 8px;font:inherit;font-variant-numeric:tabular-nums;text-align:right}
.w small{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.setcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.rep{width:44px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:center;font:inherit;font-size:.85rem;font-variant-numeric:tabular-nums;padding:0}
.hedef{color:var(--accent)!important;font-weight:700}
.replbl{font-size:.7rem;color:var(--muted)}
.alt{font-size:.88rem;color:var(--warn)}
.log{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.log h2{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.log label{font-size:.88rem;font-weight:600;display:block;margin-bottom:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{min-width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:8px;font:inherit;resize:vertical}
.saved{font-size:.78rem;color:var(--muted);text-align:right}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:640px;width:100%;display:flex;padding-inline:16px;gap:6px}
.tabbar button{flex:1;border:0;background:transparent;padding:12px 0;font-weight:600;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabbar button[aria-pressed="true"]{color:var(--accent);border-top-color:var(--accent)}
.timer{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;font-variant-numeric:tabular-nums}
.timer.run{background:var(--warn)}
.empty{color:var(--muted);padding:32px 0;text-align:center}
.week{display:grid;gap:8px;margin-top:14px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;width:100%}
.wd.today{border-color:var(--accent)}
.wd b{font-family:var(--display);font-size:1.1rem;letter-spacing:.02em}
.wd p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.hist{display:grid;gap:8px;margin-top:14px}
.hi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.hi b{font-family:var(--display);font-size:1.1rem}
.hi .meta{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.hi ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}
.rules{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.vid{font-size:.82rem;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.meta2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.totals{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar .lbl{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.bar .lbl span{color:var(--muted);font-weight:500}
.track{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.over{background:var(--warn)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:84px 1fr;gap:10px}
.meal.noimg{grid-template-columns:1fr}
.meal img{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--bg)}
.meal .info{min-width:0;display:grid;gap:4px}
.meal .info b{font-size:.95rem}
.meal .nums{font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.meal .nums strong{color:var(--fg)}
.meal .cmt{font-size:.85rem}
.meal .acts{display:flex;gap:6px;flex-wrap:wrap}
.sm{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;font-size:.8rem;font-weight:600;cursor:pointer}
.sm.danger{color:var(--warn);border-color:var(--warn)}
.form{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.form h2{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.btn{height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;padding:0 16px}
.btn.sec{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.filebtn{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:10px;border:1px dashed var(--accent);color:var(--accent);font-weight:700;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid4 label,.grid3 label{font-size:.75rem;color:var(--muted);font-weight:600}
.grid4 input,.grid3 input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 6px;font:inherit;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.est{font-size:.88rem;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.est ul{margin:4px 0 0;padding-left:18px}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl .dn{color:var(--accent);font-size:.78rem}
.rules ul{margin:6px 0 0;padding-left:18px;font-size:.9rem;display:grid;gap:4px}
.bfv{padding:10px 0;font-weight:600}.bfv .muted{font-weight:400;opacity:.6}
.pf{display:grid;gap:12px}
.pf label{display:block;font-size:.88rem;font-weight:600;margin-bottom:4px}
.pf input,.pf select{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
.pf textarea{min-height:60px}
.pf .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pf .hint{font-size:.8rem;color:var(--muted);margin-top:2px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.consent input{width:22px;height:22px;flex:0 0 auto;margin-top:2px}
.hero{background:var(--accent-soft);border-radius:12px;padding:14px;margin-top:14px}
.hero b{font-family:var(--display);font-size:1.2rem;letter-spacing:.02em}
.err{color:var(--warn);font-size:.9rem}
</style>

<div class="wrap">
  <header class="top">
    <div class="nav">
      <button class="arrow" id="prev" aria-label="Önceki gün">‹</button>
      <div class="day"><b id="dayName">Bugün</b><small id="dayMeta">Faz 1</small></div>
      <button class="arrow" id="next" aria-label="Sonraki gün">›</button>
    </div>
    <div class="row2">
      <button class="todaybtn" id="today" hidden>Bugüne dön</button>
      <button class="knee" id="knee" aria-pressed="false">Diz: normal</button>
      <div class="seg" id="seg" role="group" aria-label="Seans">
        <button data-s="sabah" aria-pressed="true">Sabah</button>
        <button data-s="aksam" aria-pressed="false">Akşam</button>
        <button data-s="yemek" aria-pressed="false">Yemek</button>
      </div>
    </div>
  </header>
  <main id="view"><p class="empty">Yükleniyor…</p></main>
</div>
<button class="timer" id="timer" aria-label="Dinlenme sayacı">Dinlen 90 sn</button>
<nav class="tabbar"><div class="in">
  <button data-t="gun" aria-pressed="true">Antrenman</button>
  <button data-t="hafta" aria-pressed="false">Hafta</button>
  <button data-t="olcum" aria-pressed="false">Ölçüm</button>
  <button data-t="gecmis" aria-pressed="false">Geçmiş</button>
  <button data-t="profil" aria-pressed="false">Profil</button>
</div></nav>

<script>
(function(){
const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S={profil:null,profilLoaded:false,targets:{},program:null,settings:{knee:'normal'},logs:{},cur:new Date(),tab:'gun',sess:(new Date().getHours()<14?'sabah':'aksam'),db:null,readonly:false,loaded:false,noDb:false,sample:null,assets:null,draft:{t:(h=>h<10?'sabah':h<14?'ogle':h<18?'ara':h<22?'aksam':'gece')(new Date().getHours()),blob:null,url:null,desc:'',est:null,busy:false,err:''},confirmDel:null};
S.cur.setHours(0,0,0,0);
const view=document.getElementById('view');

function weekOf(d){
  if(!S.program)return 1;
  const st=parseKey(S.program.start||'2026-10-05');
  const w=Math.floor((d-st)/(7*864e5))+1;
  return Math.max(1,w);
}
function pick(v,wk){if(!Array.isArray(v))return v;let out=v[0][1];for(const [f,val] of v){if(wk>=f)out=val;}return out;}
function setsFor(ex,wk){let s=pick(ex.s==null?0:ex.s,wk);if(s&&S.program&&wk===S.program.deload)s=Math.max(1,Math.ceil(s/2));return s||0;}

function autoSug(lw,r,sets){
  if(!lw||!lw.w)return null;const w=num(lw.w);if(!(w>0))return null;
  const head=String(r||'').split('·')[0].split('/')[0];const ns=(head.match(/\d+/g)||[]).map(Number);if(!ns.length)return null;
  const top=Math.max(...ns);const reps=(lw.reps||[]).filter(Boolean).map(Number);
  if(reps.length<Math.max(1,Math.min(sets||1,2)))return null;
  if(!reps.every(x=>x>=top))return null;
  const nw=w<20?w+2:w+2.5;return (Math.round(nw*10)/10).toString().replace('.',',')+' kg';
}
function curLog(){return S.logs[keyOf(S.cur)]||{date:keyOf(S.cur),items:{}};}
function lastWeight(exid,beforeKey){
  const keys=Object.keys(S.logs).filter(k=>k<beforeKey).sort().reverse();
  for(const k of keys){const it=S.logs[k].items||{};for(const ik in it){if(ik.split('.').pop()===exid&&it[ik].w)return {w:it[ik].w,reps:it[ik].reps||[],k};}}
  return null;
}

// ---------- saving (one write at a time, debounced)
const dirty=new Set();let pending=null,timerSave=null,chain=Promise.resolve();
function flushSave(){const keys=[...dirty];dirty.clear();pending=null;
  for(const k of keys){const body=JSON.parse(JSON.stringify(S.logs[k]));body.updated=new Date().toISOString();
    chain=chain.then(()=>S.db.doc('logs/'+k).set(body)).then(()=>flash('Kaydedildi')).catch(e=>{if(e&&e.code==='invalid_argument'){S.readonly=true;flash('Kaydedilemedi: link geçersiz olabilir');}else{dirty.add(k);flash('Kaydedilemedi, birazdan tekrar denenecek');setTimeout(flushSave,4000);}});}}
function queueSave(key){dirty.add(key);pending=key;clearTimeout(timerSave);timerSave=setTimeout(flushSave,600);}
function mutate(fn){
  if(!S.db||S.readonly)return;
  const k=keyOf(S.cur);const L=JSON.parse(JSON.stringify(curLog()));L.date=k;L.items=L.items||{};fn(L);S.logs[k]=L;queueSave(k);
}
let flashT=null;function flash(t){const el=document.getElementById('savedMsg');if(el){el.textContent=t;clearTimeout(flashT);flashT=setTimeout(()=>{el.textContent='';},2500);}}

// ---------- render
function render(){
  hdr(true);
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===S.tab)));
  const d=S.cur,todayKey=keyOf(new Date());
  document.getElementById('dayName').textContent=(keyOf(d)===todayKey?'Bugün · ':'')+DAYS[d.getDay()];
  const wk=weekOf(d);
  document.getElementById('dayMeta').textContent=d.getDate()+' '+MONTHS[d.getMonth()]+(S.program?' · Hafta '+wk+'/'+(S.program.weeks||9)+(S.program.deload===wk?' · deload':''):'');
  document.getElementById('today').hidden=keyOf(d)===todayKey;
  const kb=document.getElementById('knee');const kOn=S.settings.knee==='sivi'&&!!(S.program&&S.program.kneeMode);kb.classList.toggle('on',kOn);kb.textContent=kOn?'Diz: sıvı var':'Diz: normal';kb.setAttribute('aria-pressed',String(kOn));kb.hidden=!(S.program&&S.program.kneeMode);
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===S.sess)));
  document.getElementById('seg').style.visibility=S.tab==='gun'&&S.program?'visible':'hidden';
  document.getElementById('timer').hidden=!(S.tab==='gun'&&S.sess!=='yemek'&&S.program);
  if(S.noDb){hdr(false);view.innerHTML='<div class="hero"><b>Bu link geçersiz</b><p class="daynote" style="margin:6px 0 0">Sana gönderilen kişisel linki eksiksiz açtığından emin ol. Sorun devam ederse programını hazırlayan kişiye yaz.</p></div>';return;}
  if(!S.loaded||!S.profilLoaded){view.innerHTML='<p class="empty">Yükleniyor…</p>';return;}
  if(S.tab==='profil')return renderProfil();
  if(S.profilLoaded&&!S.profil)return renderProfil();
  if(S.tab==='olcum')return renderOlcum();
  if(!S.program)return renderBekle();
  if(S.tab==='hafta')return renderWeek();
  if(S.tab==='gecmis')return renderHist();
  if(S.sess==='yemek')return renderMeals();
  renderDay();
}
function rehberLink(ex){const base=S.program.rehber;return base?base+'#'+(ex.g||ex.id):null;}
function renderDay(){
  const P=S.program,d=S.cur,wk=weekOf(d),dow=String(d.getDay());

  if(day.note)h+=`<p class="daynote">${esc(day.note)}</p>`;

    const items=(B.items||[]).filter(ex=>{
      if(ex.knee==='only'&&!kOn)return false;
      if(ex.fw&&wk<ex.fw)return false;
      if(ex.dow&&!ex.dow.includes(d.getDay()))return false;
      return true;});
    if(kOn)items.sort((a,b)=>(a.leg?1:0)-(b.leg?1:0));

    for(const ex of items){

      const s=setsFor(ex,wk);const r=pick(ex.r||'',wk);

      else{
        const d0=st.d||[];

            b+=repOk?`<div class="setcol">${btn}<input class="rep" inputmode="numeric" data-rid="${esc(id)}" data-ri="${i}" value="${esc(rr[i]||'')}" placeholder="${esc(ph)}" aria-label="Set ${i+1} tekrar"></div>`:btn;}
          const lw=ex.w===false?null:lastWeight(ex.id,dk);
          const wIn=ex.w===false?'':`<div class="w"><input inputmode="decimal" id="w-${esc(id)}" data-id="${esc(id)}" value="${esc(st.w||'')}" placeholder="${esc((S.targets[ex.id]&&S.targets[ex.id].w)||'kg / bant')}" aria-label="${esc(ex.n)} ağırlık">${S.targets[ex.id]&&S.targets[ex.id].w?`<small class="hedef">Hedef: ${esc(S.targets[ex.id].w)}</small>`:''}${lw?`<small>Geçen: ${esc(lw.w)}${lw.reps&&lw.reps.some(Boolean)?' × '+esc(lw.reps.filter(Boolean).join('/')):''}</small>`:''}${(()=>{const sg=autoSug(lw,r,s);return sg?`<small class="hedef">↑ Öneri: ${esc(sg)}</small>`:''})()}</div>`;
          ctl=`<div class="sets">${b}${wIn}</div>`;}
        else{const on=!!(d0[0]);totN++;if(on)doneN++;ctl=`<div class="sets"><button class="check" data-id="${esc(id)}" data-i="0" aria-pressed="${on}">${on?'Yapıldı ✓':'Yapıldı'}</button></div>`;}
      }

    }
    h+=`<section class="block"><h2>${esc(B.t)}<span>${doneN}/${totN}</span></h2><div class="list">${cards}</div></section>`;
  }
  h+=noteCard(L);

function toJpeg(src,w,h){const sc=Math.min(1,1280/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',0.82));}
async function compress(file){
  // iPhone fotoğrafları HEIC olabilir: önce createImageBitmap, olmazsa <img> ile çöz, her durumda JPEG'e çevir
  try{const bmp=await createImageBitmap(file);const b=await toJpeg(bmp,bmp.width,bmp.height);if(b)return b;}catch(e){}
  try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});const b=await toJpeg(img,img.naturalWidth,img.naturalHeight);URL.revokeObjectURL(url);if(b)return b;}catch(e){}
  return null;
}

function isKadin(){return (S.profil&&S.profil.cinsiyet)==='Kadın';}
function bfCalc(O){return bfFrom(Object.assign({},O,{boy:(S.profil&&S.profil.boy)||'',cinsiyet:(S.profil&&S.profil.cinsiyet)||''}));}
function vki(kilo,boy){const k=num(kilo),b=num(boy)/100;if(!(k>0&&b>0))return null;return k/(b*b);}
function vkiCat(v){return v<18.5?'zayıf':v<25?'normal':v<30?'fazla kilolu':v<35?'1. derece obez':v<40?'2. derece obez':'3. derece obez';}
function bfFrom(o){const w=num(o.bel),n=num(o.boyun),h=num(o.boy),k=num(o.kalca);if(!(w>0&&n>0&&h>0&&w>n))return null;

async function saveProfil(){const o=Object.assign({},S.profil||{});document.querySelectorAll('[data-p]').forEach(el=>{o[el.dataset.p]=el.value.trim();});

function renderWeek(){
  const P=S.program,base=new Date(S.cur);const dow=(base.getDay()+6)%7;base.setDate(base.getDate()-dow);
  const wk=weekOf(base);let h=`<h1 class="daytitle">Hafta ${wk}${P.deload===wk?' · deload':''}</h1><div class="week">`;
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);const day=(P.dates||{})[keyOf(d)]||(P.days||{})[String(d.getDay())]||{};
    const blk=k=>((P.blocks||{})[k]||{}).t||k;const sb=((day.sessions||{}).sabah||[]).map(blk).join(', ');const ak=((day.sessions||{}).aksam||[]).map(blk).join(', ');
    const L=S.logs[keyOf(d)];const n=L?Object.values(L.items||{}).reduce((a,x)=>a+(x.d||[]).filter(Boolean).length,0):0;
    h+=`<button class="wd${keyOf(d)===keyOf(new Date())?' today':''}" data-go="${keyOf(d)}"><b>${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</b> · ${esc(day.title||'')}${n?` · ✓ ${n} set`:''}<p>Sabah: ${esc(sb||'—')}</p><p>Akşam: ${esc(ak||'—')}</p></button>`;}

function renderHist(){
  const keys=Object.keys(S.logs).sort().reverse();
  if(!keys.length){view.innerHTML='<p class="empty">Henüz kayıt yok. Antrenmanda setleri işaretledikçe burada görünecek.</p>';return;}
  const names={};for(const bk in ((S.program||{}).blocks||{}))for(const ex of S.program.blocks[bk].items||[])names[ex.id]=ex.n;
  let h='<div class="hist">';
  for(const k of keys){const L=S.logs[k];const d=parseKey(k);let sets=0;const ws=[];
    for(const ik in (L.items||{})){const it=L.items[ik];sets+=(it.d||[]).filter(Boolean).length;if(it.w)ws.push(`${names[ik.split('.').pop()]||ik}: ${it.w}${it.reps&&it.reps.some(Boolean)?' × '+it.reps.filter(Boolean).join('/'):''}`);}
    h+=`<article class="hi"><b>${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</b><div class="meta">${sets} set${L.knee!=null?' · diz '+L.knee+'/3':''}${L.pain!=null?' · ağrı '+L.pain+'/10':''}</div>${ws.length?`<ul>${ws.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}${L.saglik&&L.saglik.ozet?`<p class="meta">⌚ ${esc(L.saglik.ozet)}</p>`:''}${L.note?`<p class="meta">${esc(L.note)}</p>`:''}</article>`;}
  view.innerHTML=h+'</div>';
}

let tEnd=0,tInt=null;const tb=document.getElementById('timer');
function startTimer(sec){sec=sec||90;tEnd=Date.now()+sec*1000;tb.classList.add('run');clearInterval(tInt);tick();tInt=setInterval(tick,250);}
function stopTimer(){clearInterval(tInt);tb.classList.remove('run');tb.textContent='Dinlen 90 sn';}
function tick(){const left=Math.ceil((tEnd-Date.now())/1000);if(left<=0){stopTimer();tb.textContent='Hazır! Sonraki set';try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}setTimeout(()=>{if(!tb.classList.contains('run'))tb.textContent='Dinlen 90 sn';},4000);return;}
  tb.textContent='Dinlen '+Math.floor(left/60)+':'+pad(left%60)+' · durdur';}

const SB='https://arzvltufqjyxacghknbz.supabase.co',KEY='sb_publishable_1FL6JytVChw2eLieRfwDJw_JgZUYLy3';
const TOKEN=(()=>{let t=(new URLSearchParams(location.search).get('k')||'').trim();try{if(t)localStorage.setItem('pt_k',t);else t=localStorage.getItem('pt_k')||'';}catch(e){}return t;})();
async function rpc(fn,args){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw {code:'http_'+r.status};return r.json();}
async function okOrThrow(p){const ok=await p;if(ok!==true)throw {code:'invalid_argument'};return ok;}
S.db={doc:(path)=>({set:(body)=>{
  if(path.startsWith('logs/'))return okOrThrow(rpc('pt_save_log',{p_token:TOKEN,p_day:path.slice(5),p_data:body}));
  if(path==='app/profil')return okOrThrow(rpc('pt_save_profil',{p_token:TOKEN,p_profil:body}));
  if(path==='app/settings')return okOrThrow(rpc('pt_save_settings',{p_token:TOKEN,p_settings:body}));
  return Promise.reject({code:'invalid_argument'});}})};
async function load(){
  if(!/^[0-9a-f-]{36}$/i.test(TOKEN)){S.noDb=true;render();return;}
  let d;try{d=await rpc('pt_get',{p_token:TOKEN});}catch(e){if(!S.loaded){view.innerHTML='<p class="empty">Bağlantı kurulamadı. İnternetini kontrol edip sayfayı yenile.</p>';}return;}
  if(!d){S.noDb=true;render();return;}

  const t=d.targets||{};S.targets=t.items||{};

  const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))return;
  render();}
